{% extends "base.html" %}
{% block content %}
    <h2>Login</h2>
    {% for message in messages %}
        <p style="color:red;">{{ message }}</p>
    {% endfor %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}  <!-- Ensure form is passed from view -->
        <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="{% url 'register' %}">Register</a></p>
{% endblock %}
